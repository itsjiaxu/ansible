name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: YAML and Ansible lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yamllint ansible-core ansible-lint

      - name: Validate YAML syntax
        run: yamllint .

      - name: Syntax check
        run: ansible-playbook --syntax-check site.yml

      - name: Validate playbook syntax
        run: ansible-lint collections/ inventory/ site.yml

---
# defaults file for roles/linux_init
linux_timezone: Asia/Shanghai

linux_mirrors:
  ubuntu: https://mirrors.aliyun.com/ubuntu
  debian: https://mirrors.aliyun.com/debian

linux_configure_mirror: true
linux_upgrade_packages: false
linux_cache_valid_time: 3600

linux_common_packages:
  Debian:
    - build-essential
    - ca-certificates
    - curl
    - git
    - htop
    - net-tools
    - unzip
    - vim
    - wget
linux_packages: "{{ linux_common_packages[ansible_facts.os_family] | default([]) }}"